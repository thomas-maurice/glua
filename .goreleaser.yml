# goreleaser configuration for glua
#
# We do NOT ship a glua-gen binary release. The binary is small enough
# (and only useful for regenerating glua's own stubs) that `go install` is
# the right distribution channel. The release ships just the Lua stub
# tarball, which is the genuinely useful artefact for IDE autocomplete in
# Lua scripts that consume glua's built-in modules.
version: 2

before:
  hooks:
    # Regenerate all Lua stubs from the current code before packaging.
    - make gen-stubs

# No builds: section. Releases contain artefacts only (stubs tarball + checksums).
builds:
  - id: noop
    skip: true

archives:
  - id: lua-stubs
    name_template: "glua-stubs_{{ .Version }}"
    meta: true
    files:
      - src: library/*.lua

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: thomas-maurice
    name: glua
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## glua {{.Version}}

    ### Download

    - **Lua stubs**: `glua-stubs_{{.Version}}.tar.gz` — drop into your project for IDE autocomplete on glua's built-in Lua modules (`strings`, `regexp`, `log`, `k8sclient`, …).

    The `glua-gen` CLI is not bundled in releases. Install it with:

    ```bash
    go install github.com/thomas-maurice/glua/cmd/glua-gen@{{.Tag}}
    ```

    Most users embedding glua write their own ~15-line `tools/stubgen/main.go` — see the README.

  footer: |
    ## Installation

    ### Install Lua stubs for IDE autocomplete

    ```bash
    # Extract to your project
    tar -xzf glua-stubs_{{.Version}}.tar.gz -C .

    # Or extract to a specific directory
    mkdir -p lua-stubs
    tar -xzf glua-stubs_{{.Version}}.tar.gz -C lua-stubs --strip-components=1
    ```
