name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-1.26-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-1.26-

    - name: Download dependencies
      run: go mod download

    - name: Run all tests
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./pkg/...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build glua-gen
      run: go build -v ./cmd/glua-gen

    - name: Build example
      working-directory: ./example
      run: go build -v .

  integration:
    name: Integration Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run example
      working-directory: ./example
      run: |
        go run .
        echo "✓ Example completed successfully"

    - name: Generate stubs
      run: |
        go run ./cmd/glua-gen -out /tmp/library
        test -f /tmp/library/kubernetes.gen.lua || (echo "kubernetes.gen.lua not generated" && exit 1)
        echo "✓ Stub generation successful"

    - name: Verify checked-in stubs are up to date
      run: |
        go run ./cmd/glua-gen -out library
        if ! git diff --exit-code library/; then
          echo "library/*.gen.lua is out of date — run 'make gen-stubs' and commit the result"
          exit 1
        fi
        echo "✓ Checked-in stubs match generator output"

  k8sclient:
    name: K8s Client Example Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Install Kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind

    - name: Install kubectl
      run: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/kubectl

    - name: Run k8sclient example test
      run: make test-k8sclient
